name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is engine >=18. figma-developer-mcp declares >=20.20.0,
        # but the code paths this CLI uses were verified to run on 18.20 as well,
        # so 18 stays in the matrix as an early-warning job for that dependency.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
